apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-assets
  labels:
    app: static-assets
spec:
  replicas: ${STATIC_ASSETS_REPLICAS}
  selector:
    matchLabels:
      app: static-assets
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: static-assets
    spec:
      imagePullSecrets:
        - name: docker-creds

      containers:
        - name: static-assets
          imagePullPolicy: IfNotPresent
          image: ${IMAGE}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
